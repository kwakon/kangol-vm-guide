<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KANGOL · 업로드 현황</title>
  <link rel="icon" href="../assets/kangol-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="./guide-nav.css?v=20261117">
  <link rel="stylesheet" href="./style.css?v=20261117-drive-button">
  <script src="./status.js?v=20261117-detail" defer></script>
</head>
<body class="vmd-upload">
  <div class="site-shell">
  <header class="site-header" id="site-header">
    <div class="brand-row"><div class="brand-area">
      <a class="brand" href="../" aria-label="KANGOL VM GUIDE 처음으로">
        <img src="../assets/kangol-logo.svg" width="130" height="22" alt="KANGOL"><span>VM GUIDE</span>
      </a>
    </div></div>
    <nav class="vm-status-nav" aria-label="KANGOL 서비스">
      <a href="../">VM GUIDE</a><a href="./" aria-current="page">업로드 현황</a>
    </nav>
    <section class="stats" aria-label="전체 제출률">
      <div><span>전체 대상 매장</span><strong id="summary-total">—</strong></div>
      <div><span>제출 완료 매장</span><strong id="summary-complete">—</strong></div>
      <div><span>미제출 매장</span><strong id="summary-missing">—</strong></div>
      <div><span>전체 매장 제출률</span><strong id="submission-rate">—</strong></div>
    </section>
  </header>
  <main class="status-content">
    <p class="eyebrow">STORE PHOTO SUBMISSION</p>
    <div class="status-heading">
      <h1>업로드 현황</h1>
      <a class="drive-shortcut primary" href="https://drive.google.com/drive/folders/1l_H99qXxxbFiWjd1G38PZjVGeIjSnjJn"
        target="_blank" rel="noopener noreferrer" aria-label="Google Drive 바로가기 (새 탭)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M14 4h6v6m0-6-9 9m7 0v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"/>
        </svg>
        Google Drive 바로가기
      </a>
    </div>
    <noscript><p>제출 현황을 조회하려면 JavaScript를 허용해주세요.</p></noscript>
    <section class="controls" aria-label="조회 조건">
      <label>월<select id="month" disabled></select></label>
      <label>차수<select id="round" disabled></select></label>
      <button id="refresh" class="primary">새로고침</button>
      <span id="busy" role="status"></span>
    </section>
    <p id="message" role="alert" hidden></p>
    <div class="filters">
      <label>매장 유형<select id="store-type">
        <option value="">전체</option><option value="normal">정상매장</option><option value="complex">복합매장</option>
      </select></label>
      <label>매장명 검색<input id="store-search" type="search" placeholder="매장명 입력"></label>
      <label class="manager-checkbox"><input id="missing-only" type="checkbox">미제출 매장만 보기</label>
    </div>
    <div class="table-wrap manager-table"><table>
      <thead><tr><th scope="col">매장명</th><th scope="col">매장 유형</th><th scope="col">업로드 사진 수</th><th scope="col">제출 상태</th></tr></thead>
      <tbody id="store-list"></tbody>
    </table></div>
    <p id="collected-at" class="muted" role="status">마지막 집계 —</p>
    <p class="note">0장 미제출 · 1~4장 수량 부족 · 5장 이상 제출 완료. 최근 집계는 최대 60초 동안 재사용됩니다.</p>
  </main>
  </div>
</body>
</html>
